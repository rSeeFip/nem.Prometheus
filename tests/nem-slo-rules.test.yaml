rule_files:
  - nem-slo-rules.yaml

evaluation_interval: 1m

tests:
  - name: Sentinel and ProfitCenter fast burn alerts fire with sustained, sufficient traffic
    interval: 1m
    input_series:
      - series: 'nem_sentinel_mapek_cycles_completed_total{result="success"}'
        values: '0+80x65'
      - series: 'nem_sentinel_mapek_cycles_completed_total{result="error"}'
        values: '0+20x65'
      - series: 'profitcenter_message_processing_seconds_count{outcome="success"}'
        values: '0+80x65'
      - series: 'profitcenter_message_processing_seconds_count{outcome="failed"}'
        values: '0+20x65'
    alert_rule_test:
      - eval_time: 1h3m
        alertname: SentinelSLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              alertname: SentinelSLOErrorBudgetBurnFast
              severity: critical
              service: nem-sentinel
              slo: mapek-outcome
              team: platform
            exp_annotations:
              summary: "Sentinel is burning its 1% MAPE-K error budget quickly"
              description: "Bad MAPE-K outcomes are consuming the 1% error budget at more than 14.4x over both 5m and 1h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-error-budget-burn"
      - eval_time: 1h3m
        alertname: ProfitCenterSLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              alertname: ProfitCenterSLOErrorBudgetBurnFast
              severity: critical
              service: nem-profit-center
              slo: processing-outcome
              team: platform
            exp_annotations:
              summary: "ProfitCenter is burning its 1% processing error budget quickly"
              description: "Non-success and non-duplicate processing outcomes are consuming the 1% error budget at more than 14.4x over both 5m and 1h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-error-budget-burn"

  - name: SLO burn alerts stay inactive while outcomes meet the 1% objective
    interval: 1m
    input_series:
      - series: 'nem_sentinel_mapek_cycles_completed_total{result="success"}'
        values: '0+100x65'
      - series: 'nem_sentinel_mapek_cycles_completed_total{result="error"}'
        values: '0+1x65'
      - series: 'profitcenter_message_processing_seconds_count{outcome="success"}'
        values: '0+100x65'
      - series: 'profitcenter_message_processing_seconds_count{outcome="failed"}'
        values: '0+1x65'
    alert_rule_test:
      - eval_time: 1h3m
        alertname: SentinelSLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 1h3m
        alertname: ProfitCenterSLOErrorBudgetBurnFast
        exp_alerts: []

  - name: Low traffic does not page even when all observed outcomes are bad
    interval: 1m
    input_series:
      - series: 'nem_sentinel_mapek_cycles_completed_total{result="error"}'
        values: '0+1x65'
      - series: 'profitcenter_message_processing_seconds_count{outcome="failed"}'
        values: '0+1x65'
    alert_rule_test:
      - eval_time: 1h3m
        alertname: SentinelSLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 1h3m
        alertname: ProfitCenterSLOErrorBudgetBurnFast
        exp_alerts: []

  - name: Watchdog is active and explicitly marked for the game-day no-op route
    interval: 1m
    alert_rule_test:
      - eval_time: 2m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              alertname: Watchdog
              game_day: "true"
              severity: none
              service: prometheus
              team: platform
            exp_annotations:
              summary: "Prometheus alert pipeline watchdog"
              description: "This dead-man alert is intentionally routed to the game-day no-op receiver."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#watchdog-game-day"

  - name: Alertmanager target availability fires only from scrape health
    interval: 1m
    input_series:
      - series: 'up{namespace="monitoring",service="alertmanager"}'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: AlertmanagerTargetDown
        exp_alerts:
          - exp_labels:
              alertname: AlertmanagerTargetDown
              severity: critical
              service: alertmanager
              team: platform
            exp_annotations:
              summary: "Alertmanager metrics target is unavailable"
              description: "Prometheus has not scraped a healthy Alertmanager Service target for five minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#alertmanager-target-down"

  - name: Comms terminal failure and latency alerts fire with sustained sufficient traffic
    interval: 1m
    input_series:
      - series: 'comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="success"}'
        values: '0+8x30'
      - series: 'comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="failure"}'
        values: '0+2x30'
      - series: 'comms_alert_webhook_processing_total{service="nem-comms",operation_result="completed"}'
        values: '0+8x30'
      - series: 'comms_alert_webhook_processing_total{service="nem-comms",operation_result="failed"}'
        values: '0+2x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="10"}'
        values: '0+0x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="25"}'
        values: '0+10x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: CommsDeliveryFailureRatioHigh
        exp_alerts:
          - exp_labels:
              alertname: CommsDeliveryFailureRatioHigh
              severity: critical
              service: nem-comms
              team: platform
            exp_annotations:
              summary: "Comms terminal delivery failure ratio exceeds 5%"
              description: "Channel-assistant terminal delivery failures exceeded 5% for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-delivery-failures"
      - eval_time: 16m
        alertname: CommsAlertProcessingFailureRatioHigh
        exp_alerts:
          - exp_labels:
              alertname: CommsAlertProcessingFailureRatioHigh
              severity: critical
              service: nem-comms
              team: platform
            exp_annotations:
              summary: "Comms alert-webhook processing failure ratio exceeds 5%"
              description: "Alert-webhook terminal processing failures exceeded 5% for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-alert-processing-failures"
      - eval_time: 16m
        alertname: CommsAlertTerminalLatencyHigh
        exp_alerts:
          - exp_labels:
              alertname: CommsAlertTerminalLatencyHigh
              severity: warning
              service: nem-comms
              team: platform
            exp_annotations:
              summary: "Comms alert-webhook p95 terminal latency exceeds ten seconds"
              description: "Alert-webhook p95 receipt-to-terminal latency exceeded ten seconds for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-alert-terminal-latency"

  - name: Healthy Comms terminal outcomes keep failure and latency alerts inactive
    interval: 1m
    input_series:
      - series: 'comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="success"}'
        values: '0+10x30'
      - series: 'comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="failure"}'
        values: '0+0x30'
      - series: 'comms_alert_webhook_processing_total{service="nem-comms",operation_result="completed"}'
        values: '0+10x30'
      - series: 'comms_alert_webhook_processing_total{service="nem-comms",operation_result="failed"}'
        values: '0+0x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="5"}'
        values: '0+10x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="10"}'
        values: '0+10x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: CommsDeliveryFailureRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: CommsAlertProcessingFailureRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: CommsAlertTerminalLatencyHigh
        exp_alerts: []

  - name: Low Comms traffic does not page even when every terminal outcome is bad
    interval: 1m
    input_series:
      - series: 'comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="failure"}'
        values: '0+1x30'
      - series: 'comms_alert_webhook_processing_total{service="nem-comms",operation_result="failed"}'
        values: '0+1x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="10"}'
        values: '0+0x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="25"}'
        values: '0+1x30'
      - series: 'comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms",le="+Inf"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: CommsDeliveryFailureRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: CommsAlertProcessingFailureRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: CommsAlertTerminalLatencyHigh
        exp_alerts: []

  - name: Comms target availability fires only from scrape health
    interval: 1m
    input_series:
      - series: 'up{namespace="nem-apps",service="nem-comms"}'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: CommsTargetDown
        exp_alerts:
          - exp_labels:
              alertname: CommsTargetDown
              severity: critical
              service: nem-comms
              team: platform
            exp_annotations:
              summary: "Comms metrics target is unavailable"
              description: "Prometheus has not scraped a healthy nem.Comms Service target for five minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-target-down"
