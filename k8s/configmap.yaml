apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: nem-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/nem-slo-rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-annotated-services
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      - job_name: kubernetes-annotated-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

  nem-slo-rules.yaml: |
    groups:
      - name: nem-sentinel-slos
        interval: 30s
        rules:
          - record: nem_slo:sentinel_target_available
            expr: max(up{namespace="nem-apps",pod=~"nem-sentinel-.*"}) or vector(0)
          - record: nem_slo:sentinel_mapek_failure_ratio:5m
            expr: |
              (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[5m])) or vector(0))
              /
              clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[5m])) or vector(0)), 0.000001)
          - record: nem_slo:sentinel_mapek_latency_milliseconds:p95_5m
            expr: histogram_quantile(0.95, sum by (le) (rate(nem_sentinel_mapek_cycles_duration_milliseconds_bucket[5m])))
          - record: nem_slo:sentinel_remediation_blocked_rate:5m
            expr: sum by (reason) (rate(nem_sentinel_remediation_blocked_total[5m]))
          - alert: SentinelTargetDown
            expr: absent(up{namespace="nem-apps",pod=~"nem-sentinel-.*"}) or max(up{namespace="nem-apps",pod=~"nem-sentinel-.*"}) == 0
            for: 5m
            labels:
              severity: critical
              service: nem-sentinel
              team: platform
            annotations:
              summary: "Sentinel metrics target is unavailable"
              description: "Prometheus has not scraped a healthy nem.Sentinel target in nem-apps for five minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-target-down"
          - alert: SentinelMapekFailureRatioHigh
            expr: nem_slo:sentinel_mapek_failure_ratio:5m > 0.05
            for: 10m
            labels:
              severity: critical
              service: nem-sentinel
              team: platform
            annotations:
              summary: "Sentinel MAPE-K cycle failure ratio exceeds 5%"
              description: "MAPE-K terminal results classified as executed_failure or error exceeded 5% over ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-mapek-failures"
          - alert: SentinelMapekLatencyHigh
            expr: nem_slo:sentinel_mapek_latency_milliseconds:p95_5m > 5000
            for: 10m
            labels:
              severity: warning
              service: nem-sentinel
              team: platform
            annotations:
              summary: "Sentinel MAPE-K p95 latency exceeds five seconds"
              description: "The p95 observation-to-decision cycle duration remained above 5000ms for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-mapek-latency"
          - alert: SentinelRemediationBlockedStorm
            expr: sum(nem_slo:sentinel_remediation_blocked_rate:5m) > 0.05
            for: 5m
            labels:
              severity: warning
              service: nem-sentinel
              team: platform
            annotations:
              summary: "Sentinel remediation blocks are repeating"
              description: "Safety gates blocked more than 0.05 remediation attempts per second for five minutes. Inspect the bounded reason breakdown."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-remediation-blocks"

      - name: nem-profitcenter-slos
        interval: 30s
        rules:
          - record: nem_slo:profitcenter_target_available
            expr: max(up{namespace="nem-apps",service="nem-profit-center"}) or vector(0)
          - record: nem_slo:profitcenter_processing_accepted_ratio:5m
            expr: |
              (sum(rate(profitcenter_message_processing_seconds_count{outcome=~"success|duplicate"}[5m])) or vector(0))
              /
              clamp_min((sum(rate(profitcenter_message_processing_seconds_count[5m])) or vector(0)), 0.000001)
          - record: nem_slo:profitcenter_processing_latency_seconds:p95_5m
            expr: histogram_quantile(0.95, sum by (le) (rate(profitcenter_message_processing_seconds_bucket[5m])))
          - record: nem_slo:profitcenter_messaging_failure_ratio:5m
            expr: |
              (sum(rate(profitcenter_messaging_publish_failures_total[5m])) or vector(0))
              /
              clamp_min((sum(rate(profitcenter_messaging_publish_attempts_total[5m])) or vector(0)), 0.000001)
          - record: nem_slo:profitcenter_ml_prediction_error_ratio:15m
            expr: |
              (sum(rate(profitcenter_ml_prediction_errors_total[15m])) or vector(0))
              /
              clamp_min((sum(rate(profitcenter_ml_predictions_total[15m])) or vector(0)), 0.000001)
          - alert: ProfitCenterTargetDown
            expr: absent(up{namespace="nem-apps",service="nem-profit-center"}) or max(up{namespace="nem-apps",service="nem-profit-center"}) == 0
            for: 5m
            labels:
              severity: critical
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter metrics target is unavailable"
              description: "Prometheus has not scraped a healthy nem.ProfitCenter Service target for five minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-target-down"
          - alert: ProfitCenterProcessingSuccessLow
            expr: nem_slo:profitcenter_processing_accepted_ratio:5m < 0.99 and sum(rate(profitcenter_message_processing_seconds_count[5m])) > 0
            for: 10m
            labels:
              severity: critical
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter accepted processing ratio is below 99%"
              description: "Successful or idempotently duplicated message outcomes remained below 99% for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-processing-failures"
          - alert: ProfitCenterProcessingLatencyHigh
            expr: nem_slo:profitcenter_processing_latency_seconds:p95_5m > 5
            for: 10m
            labels:
              severity: warning
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter processing p95 latency exceeds five seconds"
              description: "Message-processing p95 latency remained above five seconds for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-processing-latency"
          - alert: ProfitCenterIngestionBacklog
            expr: max(profitcenter_ingestion_queue_depth_events) > 100 or max(profitcenter_ingestion_lag_seconds) > 300
            for: 10m
            labels:
              severity: warning
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter ingestion is backlogged"
              description: "Queue depth exceeded 100 events or ingestion lag exceeded five minutes for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-ingestion-backlog"
          - alert: ProfitCenterMessagingFailureRatioHigh
            expr: nem_slo:profitcenter_messaging_failure_ratio:5m > 0.05 and sum(rate(profitcenter_messaging_publish_attempts_total[5m])) > 0
            for: 10m
            labels:
              severity: critical
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter messaging failure ratio exceeds 5%"
              description: "Publishing failures exceeded 5% of attempts for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-messaging-failures"
          - alert: ProfitCenterDeadLetterQueueNotEmpty
            expr: max(profitcenter_messaging_dlq_count) > 0
            for: 10m
            labels:
              severity: warning
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter dead-letter queue is not empty"
              description: "One or more messages remained in the ProfitCenter dead-letter queue for ten minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-dead-letter-queue"
          - alert: ProfitCenterMlPredictionErrorsHigh
            expr: nem_slo:profitcenter_ml_prediction_error_ratio:15m > 0.05 and sum(rate(profitcenter_ml_predictions_total[15m])) > 0
            for: 15m
            labels:
              severity: warning
              service: nem-profit-center
              team: platform
            annotations:
              summary: "ProfitCenter ML prediction error ratio exceeds 5%"
              description: "Prediction errors exceeded 5% of predictions over fifteen minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-ml-prediction-errors"

      - name: nem-comms-slos
        interval: 30s
        rules:
          - record: nem_slo:comms_target_available
            expr: max(up{namespace="nem-apps",service="nem-comms"}) or vector(0)
          - record: nem_slo:comms_delivery_failure_ratio:5m
            expr: |
              (sum(rate(comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result="failure"}[5m])) or vector(0))
              /
              clamp_min((sum(rate(comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result=~"success|failure"}[5m])) or vector(0)), 0.000001)
          - record: nem_slo:comms_alert_processing_failure_ratio:5m
            expr: |
              (sum(rate(comms_alert_webhook_processing_total{service="nem-comms",operation_result="failed"}[5m])) or vector(0))
              /
              clamp_min((sum(rate(comms_alert_webhook_processing_total{service="nem-comms",operation_result=~"completed|failed"}[5m])) or vector(0)), 0.000001)
          - record: nem_slo:comms_alert_terminal_latency_seconds:p95_5m
            expr: histogram_quantile(0.95, sum by (le) (rate(comms_alert_webhook_receipt_to_terminal_duration_seconds_bucket{service="nem-comms"}[5m])))
          - alert: CommsTargetDown
            expr: absent(up{namespace="nem-apps",service="nem-comms"}) or max(up{namespace="nem-apps",service="nem-comms"}) == 0
            for: 5m
            labels:
              severity: critical
              service: nem-comms
              team: platform
            annotations:
              summary: "Comms metrics target is unavailable"
              description: "Prometheus has not scraped a healthy nem.Comms Service target for five minutes."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-target-down"
          - alert: CommsDeliveryFailureRatioHigh
            expr: |
              nem_slo:comms_delivery_failure_ratio:5m > 0.05
              and sum(increase(comms_channel_assistant_delivery_outcome_total{service="nem-comms",operation_result=~"success|failure"}[5m])) >= 10
            for: 10m
            labels:
              severity: critical
              service: nem-comms
              team: platform
            annotations:
              summary: "Comms terminal delivery failure ratio exceeds 5%"
              description: "Channel-assistant terminal delivery failures exceeded 5% for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-delivery-failures"
          - alert: CommsAlertProcessingFailureRatioHigh
            expr: |
              nem_slo:comms_alert_processing_failure_ratio:5m > 0.05
              and sum(increase(comms_alert_webhook_processing_total{service="nem-comms",operation_result=~"completed|failed"}[5m])) >= 10
            for: 10m
            labels:
              severity: critical
              service: nem-comms
              team: platform
            annotations:
              summary: "Comms alert-webhook processing failure ratio exceeds 5%"
              description: "Alert-webhook terminal processing failures exceeded 5% for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-alert-processing-failures"
          - alert: CommsAlertTerminalLatencyHigh
            expr: |
              nem_slo:comms_alert_terminal_latency_seconds:p95_5m > 10
              and sum(increase(comms_alert_webhook_processing_total{service="nem-comms",operation_result=~"completed|failed"}[5m])) >= 10
            for: 10m
            labels:
              severity: warning
              service: nem-comms
              team: platform
            annotations:
              summary: "Comms alert-webhook p95 terminal latency exceeds ten seconds"
              description: "Alert-webhook p95 receipt-to-terminal latency exceeded ten seconds for ten minutes with at least ten terminal outcomes in the five-minute window."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#comms-alert-terminal-latency"

      - name: nem-slo-burn-rate-governance
        interval: 30s
        rules:
          - record: nem_slo:sentinel_mapek_error_budget_burn_rate:5m
            expr: |
              (
                (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[5m])) or vector(0))
                /
                clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[5m])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:sentinel_mapek_error_budget_burn_rate:1h
            expr: |
              (
                (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[1h])) or vector(0))
                /
                clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[1h])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:sentinel_mapek_error_budget_burn_rate:30m
            expr: |
              (
                (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[30m])) or vector(0))
                /
                clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[30m])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:sentinel_mapek_error_budget_burn_rate:6h
            expr: |
              (
                (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[6h])) or vector(0))
                /
                clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[6h])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:sentinel_mapek_error_budget_burn_rate:3d
            expr: |
              (
                (sum(rate(nem_sentinel_mapek_cycles_completed_total{result=~"executed_failure|error"}[3d])) or vector(0))
                /
                clamp_min((sum(rate(nem_sentinel_mapek_cycles_completed_total[3d])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:profitcenter_processing_error_budget_burn_rate:5m
            expr: |
              (
                (sum(rate(profitcenter_message_processing_seconds_count{outcome!~"success|duplicate"}[5m])) or vector(0))
                /
                clamp_min((sum(rate(profitcenter_message_processing_seconds_count[5m])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:profitcenter_processing_error_budget_burn_rate:1h
            expr: |
              (
                (sum(rate(profitcenter_message_processing_seconds_count{outcome!~"success|duplicate"}[1h])) or vector(0))
                /
                clamp_min((sum(rate(profitcenter_message_processing_seconds_count[1h])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:profitcenter_processing_error_budget_burn_rate:30m
            expr: |
              (
                (sum(rate(profitcenter_message_processing_seconds_count{outcome!~"success|duplicate"}[30m])) or vector(0))
                /
                clamp_min((sum(rate(profitcenter_message_processing_seconds_count[30m])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:profitcenter_processing_error_budget_burn_rate:6h
            expr: |
              (
                (sum(rate(profitcenter_message_processing_seconds_count{outcome!~"success|duplicate"}[6h])) or vector(0))
                /
                clamp_min((sum(rate(profitcenter_message_processing_seconds_count[6h])) or vector(0)), 0.000001)
              ) / 0.01
          - record: nem_slo:profitcenter_processing_error_budget_burn_rate:3d
            expr: |
              (
                (sum(rate(profitcenter_message_processing_seconds_count{outcome!~"success|duplicate"}[3d])) or vector(0))
                /
                clamp_min((sum(rate(profitcenter_message_processing_seconds_count[3d])) or vector(0)), 0.000001)
              ) / 0.01
          - alert: SentinelSLOErrorBudgetBurnFast
            expr: |
              nem_slo:sentinel_mapek_error_budget_burn_rate:5m > 14.4
              and nem_slo:sentinel_mapek_error_budget_burn_rate:1h > 14.4
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[5m])) >= 10
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[1h])) >= 60
            for: 2m
            labels:
              severity: critical
              service: nem-sentinel
              slo: mapek-outcome
              team: platform
            annotations:
              summary: "Sentinel is burning its 1% MAPE-K error budget quickly"
              description: "Bad MAPE-K outcomes are consuming the 1% error budget at more than 14.4x over both 5m and 1h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-error-budget-burn"
          - alert: SentinelSLOErrorBudgetBurnMedium
            expr: |
              nem_slo:sentinel_mapek_error_budget_burn_rate:30m > 6
              and nem_slo:sentinel_mapek_error_budget_burn_rate:6h > 6
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[30m])) >= 30
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[6h])) >= 360
            for: 15m
            labels:
              severity: critical
              service: nem-sentinel
              slo: mapek-outcome
              team: platform
            annotations:
              summary: "Sentinel is burning its 1% MAPE-K error budget"
              description: "Bad MAPE-K outcomes are consuming the 1% error budget at more than 6x over both 30m and 6h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-error-budget-burn"
          - alert: SentinelSLOErrorBudgetBurnSlow
            expr: |
              nem_slo:sentinel_mapek_error_budget_burn_rate:6h > 1
              and nem_slo:sentinel_mapek_error_budget_burn_rate:3d > 1
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[6h])) >= 360
              and sum(increase(nem_sentinel_mapek_cycles_completed_total[3d])) >= 4320
            for: 1h
            labels:
              severity: warning
              service: nem-sentinel
              slo: mapek-outcome
              team: platform
            annotations:
              summary: "Sentinel is steadily burning its 1% MAPE-K error budget"
              description: "Bad MAPE-K outcomes are consuming the 1% error budget at more than 1x over both 6h and 3d, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#sentinel-error-budget-burn"
          - alert: ProfitCenterSLOErrorBudgetBurnFast
            expr: |
              nem_slo:profitcenter_processing_error_budget_burn_rate:5m > 14.4
              and nem_slo:profitcenter_processing_error_budget_burn_rate:1h > 14.4
              and sum(increase(profitcenter_message_processing_seconds_count[5m])) >= 10
              and sum(increase(profitcenter_message_processing_seconds_count[1h])) >= 60
            for: 2m
            labels:
              severity: critical
              service: nem-profit-center
              slo: processing-outcome
              team: platform
            annotations:
              summary: "ProfitCenter is burning its 1% processing error budget quickly"
              description: "Non-success and non-duplicate processing outcomes are consuming the 1% error budget at more than 14.4x over both 5m and 1h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-error-budget-burn"
          - alert: ProfitCenterSLOErrorBudgetBurnMedium
            expr: |
              nem_slo:profitcenter_processing_error_budget_burn_rate:30m > 6
              and nem_slo:profitcenter_processing_error_budget_burn_rate:6h > 6
              and sum(increase(profitcenter_message_processing_seconds_count[30m])) >= 30
              and sum(increase(profitcenter_message_processing_seconds_count[6h])) >= 360
            for: 15m
            labels:
              severity: critical
              service: nem-profit-center
              slo: processing-outcome
              team: platform
            annotations:
              summary: "ProfitCenter is burning its 1% processing error budget"
              description: "Non-success and non-duplicate processing outcomes are consuming the 1% error budget at more than 6x over both 30m and 6h, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-error-budget-burn"
          - alert: ProfitCenterSLOErrorBudgetBurnSlow
            expr: |
              nem_slo:profitcenter_processing_error_budget_burn_rate:6h > 1
              and nem_slo:profitcenter_processing_error_budget_burn_rate:3d > 1
              and sum(increase(profitcenter_message_processing_seconds_count[6h])) >= 360
              and sum(increase(profitcenter_message_processing_seconds_count[3d])) >= 4320
            for: 1h
            labels:
              severity: warning
              service: nem-profit-center
              slo: processing-outcome
              team: platform
            annotations:
              summary: "ProfitCenter is steadily burning its 1% processing error budget"
              description: "Non-success and non-duplicate processing outcomes are consuming the 1% error budget at more than 1x over both 6h and 3d, with sufficient traffic."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#profitcenter-error-budget-burn"
          - alert: Watchdog
            expr: vector(1)
            labels:
              game_day: "true"
              severity: none
              service: prometheus
              team: platform
            annotations:
              summary: "Prometheus alert pipeline watchdog"
              description: "This dead-man alert is intentionally routed to the game-day no-op receiver."
              runbook_url: "https://github.com/rSeeFip/nem.Prometheus/blob/main/docs/runbooks/telemetry-slos.md#watchdog-game-day"
          - alert: AlertmanagerTargetDown
            expr: absent(up{namespace="monitoring",service="alertmanager"}) or max(up{namespace="monitoring",service="alertmanager"}) == 0
            for: 5m
            labels:
              severity: critical
              service: alertmanager
              team: platform
            annotations:
              summary: "Alertmanager metrics target is unavailable"
